[project]
name = "bag-assistant-api"
version = "0.1.0"
description = "Multimodal bug assistant backend and Telegram bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20",
    "asyncpg>=0.29",
    "fastapi>=0.110",
    "httpx>=0.27",
    "qdrant-client>=1.14,<2",
    "llama-index",
    "llama-index-vector-stores-qdrant",
    "llama-index-readers-file",
    "openai>=2.0,<3",
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.1",
    "tenacity>=9.0",
    "diskcache>=5.6",
    "tiktoken>=0.7",
    "tqdm>=4.66",
    "uvicorn[standard]>=0.29",
    "huggingface-hub>=0.30",
    "sentence-transformers>=3.0",
    "razdel>=0.5,<0.6",
    "reportlab>=4,<5",
    "pymupdf>=1.24,<2",
    "filelock>=3,<4",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "langgraph-checkpoint-postgres>=3.2.0,<4",
    "aiosqlite>=0.20,<1",
    "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.4,<0.5",
    "langchain-community>=0.4,<0.5",
    "anthropic>=0.40",
    "pandas>=2",
    "arize-phoenix>=5",
    "rapidfuzz>=3,<4",
]

tracing = [
    "arize-phoenix-otel",
    "openinference-instrumentation-openai>=0.1.7",
    "openinference-instrumentation-llama-index>=3,<4",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
